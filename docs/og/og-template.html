<!doctype html>
<!--
  Source for frontend/public/og.png (link preview image, 1200×630).
  Not part of the Vite build. Open this file in Chrome at a 1200×630 viewport
  (device scale 1) and take a screenshot of the page; see docs/OPERATIONS.md.
  Colours are the light tokens from frontend/src/index.css («Светлая витрина»).
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Python Academy — og.png</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f5f5f7;
        --fg: #1d1d1f;
        --fg-muted: #6e6e73;
        --accent: #0071e3;
        --code-keyword: #b4234a;
        --code-string: #1a7f37;
        --code-fn: #0a58ca;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "SF Pro Display", "Onest", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 56px;
        height: 100%;
        padding: 72px 80px;
        align-items: center;
      }
      .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
      h1 {
        margin-top: 40px;
        font-size: 64px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      .lead { margin-top: 24px; font-size: 26px; line-height: 1.35; color: var(--fg-muted); max-width: 30ch; }
      .meta { margin-top: 40px; font-size: 20px; color: var(--fg-muted); }
      .meta b { color: var(--accent); font-weight: 600; }
      .code {
        background: var(--surface);
        border-radius: 24px;
        padding: 36px 36px 40px;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 22px;
        line-height: 1.75;
        font-variant-ligatures: none;
      }
      .code .label { font-family: inherit; font-size: 16px; color: var(--fg-muted); margin-bottom: 14px; }
      .line { display: flex; gap: 22px; white-space: pre; }
      .n { width: 1.2em; text-align: right; color: var(--fg-muted); }
      .kw { color: var(--code-keyword); }
      .str { color: var(--code-string); }
      .fn { color: var(--code-fn); }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <p class="brand">Python Academy</p>
        <h1>Python и математика с нуля</h1>
        <p class="lead">Короткая теория, примеры из жизни и проверка после каждой темы.</p>
        <p class="meta"><b>Бесплатно</b> · прогресс общий с Telegram-ботом</p>
      </div>
      <div class="code" aria-hidden="true">
        <p class="label">first_lesson.py</p>
        <div class="line"><span class="n">1</span><span>name = <span class="fn">input</span>(<span class="str">"Как тебя зовут? "</span>)</span></div>
        <div class="line"><span class="n">2</span><span><span class="kw">if</span> name:</span></div>
        <div class="line"><span class="n">3</span><span>    <span class="fn">print</span>(<span class="str">f"Привет, {name}!"</span>)</span></div>
        <div class="line"><span class="n">4</span><span><span class="kw">else</span>:</span></div>
        <div class="line"><span class="n">5</span><span>    <span class="fn">print</span>(<span class="str">"Привет, мир!"</span>)</span></div>
      </div>
    </div>
  </body>
</html>
