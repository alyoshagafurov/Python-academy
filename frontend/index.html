<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Python Academy — Python и математика с нуля</title>
    <meta
      name="description"
      content="Бесплатные курсы Python и математики мышления: короткая теория, примеры из жизни и проверка после каждой темы. Без регистрации."
    />
    <script>
      // Apply the theme before first paint (no flash). Mirrors hooks/useTheme.tsx.
      (function () {
        try {
          var saved = localStorage.getItem("pkh-theme-v2");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
